<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OD Drive Motorista - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fa;
      color: #0f1e2e;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(420px, 100%);
      border: 1px solid #d8e0ea;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(16, 25, 34, 0.1);
      padding: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: #4c5c6d; line-height: 1.4; }
    button {
      appearance: none;
      border: 1px solid #1d6fd8;
      background: #1d6fd8;
      color: #fff;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <article class="card">
    <h1>Sem conexão</h1>
    <p>A área do motorista precisa de internet para enviar evidências. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </article>
</body>
</html>
