<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal de Solicitação - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f8;
      color: #101922;
      font-family: "Work Sans", "Segoe UI", Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(460px, 100%);
      border: 1px solid #dbe3ec;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(16,25,34,0.11);
      padding: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { margin: 0 0 14px; color: #5f6e7c; line-height: 1.45; }
    button {
      appearance: none;
      border: 1px solid #1173d4;
      background: #1173d4;
      color: #fff;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <article class="card">
    <h1>Sem conexão</h1>
    <p>Você está offline. Conecte-se novamente para enviar a solicitação de orçamento.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </article>
</body>
</html>
